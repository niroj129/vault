services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiffany}
      POSTGRES_USER: ${POSTGRES_USER:-tiffany}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiffany}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      # unknown domains show the platform site (set 0 once all client
      # domains are added in the Platform panel)
      TENANT_FALLBACK: ${TENANT_FALLBACK:-1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-tiffany}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tiffany}
      CORS_ORIGINS: ${PUBLIC_URL}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-${PUBLIC_URL}}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SEED: ${SEED:-1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-0}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/games/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s   # allow first-boot migrate + seed (image generation)

  # payment safety net: checks pending BytePayout deposits and finishes
  # stuck game loads every 2 minutes (in case a webhook is missed)
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["sh", "-c", "i=0; while true; do python manage.py sync_deposits; if [ $$((i % 5)) -eq 0 ]; then python manage.py sync_points; fi; i=$$((i+1)); sleep 120; done"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-tiffany}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tiffany}
    volumes:
      - media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        # the site is served on many tenant domains: the browser calls the API
        # on whatever domain it is on, so no public URL is baked into the build
        INTERNAL_API_URL: http://backend:8000
    restart: unless-stopped
    environment:
      # server-side rendering reaches the backend directly (media stays public)
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/media:ro
      - static:/static:ro

volumes:
  pgdata:
  media:
  static:
